```yaml
name: Deploy Dev

on:
  push:
    branches:
      - feat/translation

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --------------------------------------------------
      # 3. Install all dependencies for the build
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Generate Prisma Client
      # --------------------------------------------------
      - name: Generate Prisma Client
        run: npx prisma generate

      # --------------------------------------------------
      # 5. Build NestJS application
      # --------------------------------------------------
      - name: Build application
        run: npm run build

      # --------------------------------------------------
      # 6. Prepare deployment package
      #
      # Only runtime-required files are copied.
      # Development/build configuration is NOT deployed.
      # --------------------------------------------------
      - name: Prepare deployment package
        run: |
          mkdir -p deploy

          # Compiled NestJS application
          cp -r dist deploy/

          # Runtime static assets
          cp -r public deploy/

          # Prisma schema/config/migrations
          cp -r prisma deploy/
          cp prisma.config.ts deploy/

          # Dependency manifests
          cp package.json deploy/
          cp package-lock.json deploy/

          # Runtime storage directory if required
          if [ -d "storage" ]; then
            cp -r storage deploy/
          fi

      # --------------------------------------------------
      # 7. Deploy runtime files to Dev VPS
      # --------------------------------------------------
      - name: Deploy files to Dev VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "deploy/*"
          target: "~/www/ai-flashcard/backend"
          strip_components: 1

      # --------------------------------------------------
      # 8. Install production dependencies and restart PM2
      # --------------------------------------------------
      - name: Install dependencies and restart backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -e

            cd ~/www/ai-flashcard/backend

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "Restarting backend..."
            pm2 restart ai-flashcard-backend

            echo "Deployment completed successfully."
```
