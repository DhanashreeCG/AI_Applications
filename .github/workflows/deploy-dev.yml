name: Deploy Dev

on:
  push:
    branches:
      - feat/translation
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm

      # --------------------------------------------------
      # 3. Install all dependencies for the build
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Generate Prisma Client
      # (also runs via postinstall; kept explicit for clarity)
      # --------------------------------------------------
      - name: Generate Prisma Client
        run: npx prisma generate

      # --------------------------------------------------
      # 5. Build NestJS application
      # --------------------------------------------------
      - name: Build application
        run: npm run build

      # --------------------------------------------------
      # 6. Prepare deployment package
      #
      # Only runtime-required files are copied.
      # Development/build configuration is NOT deployed.
      # Prisma client is already compiled into dist/generated.
      # --------------------------------------------------
      - name: Prepare deployment package
        run: |
          mkdir -p deploy

          # Compiled NestJS application (includes dist/generated/prisma)
          cp -r dist deploy/

          # Runtime static assets
          cp -r public deploy/

          # Prisma schema/config/migrations (for future migrate runs)
          cp -r prisma deploy/
          cp prisma.config.ts deploy/

          # Dependency manifests
          cp package.json deploy/
          cp package-lock.json deploy/

          # Runtime storage directory if required
          if [ -d "storage" ]; then
            cp -r storage deploy/
          fi

          echo "Deploy package contents:"
          find deploy -maxdepth 3 -type d | sort

      # --------------------------------------------------
      # 7. Deploy runtime files to Dev VPS
      # --------------------------------------------------
      - name: Deploy files to Dev VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "deploy/"
          target: "~/www/ai-flashcard/backend"
          strip_components: 1
          overwrite: true

      # --------------------------------------------------
      # 8. Install production dependencies and restart PM2
      # --------------------------------------------------
      - name: Install dependencies and restart backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -euo pipefail

            # Non-interactive SSH does not load interactive shell RC files,
            # so nvm/npm/pm2 are often missing from PATH. Load them explicitly.
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:$PATH"

            if [ -f "$HOME/.nvm/nvm.sh" ]; then
              # shellcheck disable=SC1091
              . "$HOME/.nvm/nvm.sh"
            elif [ -f "$HOME/.bashrc" ]; then
              # shellcheck disable=SC1091
              . "$HOME/.bashrc"
            elif [ -f "$HOME/.profile" ]; then
              # shellcheck disable=SC1091
              . "$HOME/.profile"
            fi

            if [ -f "$HOME/.fnm/fnm" ] || command -v fnm >/dev/null 2>&1; then
              eval "$(fnm env)" || true
            fi

            cd ~/www/ai-flashcard/backend

            if ! command -v npm >/dev/null 2>&1; then
              echo "ERROR: npm not found in PATH after loading shell env."
              echo "PATH=$PATH"
              exit 127
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "ERROR: pm2 not found in PATH after loading shell env."
              echo "PATH=$PATH"
              exit 127
            fi

            echo "Using node: $(command -v node) ($(node -v))"
            echo "Using npm:  $(command -v npm) ($(npm -v))"
            echo "Using pm2:  $(command -v pm2)"

            # prisma is a devDependency; postinstall runs `prisma generate`.
            # Generated client is already inside dist/, so skip lifecycle scripts.
            echo "Installing production dependencies..."
            npm ci --omit=dev --ignore-scripts

            echo "Restarting backend..."
            if pm2 describe ai-flashcard-backend >/dev/null 2>&1; then
              pm2 restart ai-flashcard-backend --update-env
            else
              echo "ERROR: PM2 process 'ai-flashcard-backend' does not exist."
              echo "Create it once on the VPS before relying on restart, e.g.:"
              echo "  cd ~/www/ai-flashcard/backend && pm2 start dist/src/main.js --name ai-flashcard-backend"
              pm2 list || true
              exit 1
            fi

            echo "PM2 status:"
            pm2 describe ai-flashcard-backend

            echo "Deployment completed successfully."
