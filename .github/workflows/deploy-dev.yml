name: Deploy Dev

on:
  push:
    branches:
      - feat/translation
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --------------------------------------------------
      # 3. Install all dependencies for the build
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Generate Prisma Client
      # (also runs via postinstall; kept explicit for clarity)
      # --------------------------------------------------
      - name: Generate Prisma Client
        run: npx prisma generate

      # --------------------------------------------------
      # 5. Build NestJS application
      # --------------------------------------------------
      - name: Build application
        run: npm run build

      # --------------------------------------------------
      # 6. Prepare deployment package
      #
      # Only runtime-required files are copied.
      # Development/build configuration is NOT deployed.
      # Prisma client is already compiled into dist/generated.
      # --------------------------------------------------
      - name: Prepare deployment package
        run: |
          mkdir -p deploy

          # Compiled NestJS application (includes dist/generated/prisma)
          cp -r dist deploy/

          # Runtime static assets
          cp -r public deploy/

          # Prisma schema/config/migrations (for future migrate runs)
          cp -r prisma deploy/
          cp prisma.config.ts deploy/

          # Dependency manifests
          cp package.json deploy/
          cp package-lock.json deploy/

          # Runtime storage directory if required
          if [ -d "storage" ]; then
            cp -r storage deploy/
          fi

          echo "Deploy package contents:"
          find deploy -maxdepth 3 -type d | sort

      # --------------------------------------------------
      # 7. Deploy runtime files to Dev VPS
      # --------------------------------------------------
      - name: Deploy files to Dev VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "deploy/"
          target: "~/www/ai-flashcard/backend"
          strip_components: 1
          overwrite: true

      # --------------------------------------------------
      # 8. Install production dependencies and restart PM2
      # --------------------------------------------------
      - name: Install dependencies and restart backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -euo pipefail

            cd ~/www/ai-flashcard/backend

            # prisma is a devDependency; postinstall runs `prisma generate`.
            # Generated client is already inside dist/, so skip lifecycle scripts.
            echo "Installing production dependencies..."
            npm ci --omit=dev --ignore-scripts

            echo "Restarting backend..."
            pm2 restart ai-flashcard-backend --update-env

            echo "PM2 status:"
            pm2 describe ai-flashcard-backend | head -n 40

            echo "Deployment completed successfully."
