name: Deploy Prod Frontend

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "flashcards_deploy.sh"
      - ".github/workflows/deploy-frontend-prod.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod-frontend
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Changes are only on the runner — not committed back to GitHub
      - name: Prepare frontend for S3 deploy
        run: |
          set -euo pipefail

          # Serve flashcards as the site index
          cp public/flashcards.html public/index.html

          # Point both frontends at the prod API
          cat > public/env-config.js <<'EOF'
          /* Generated by deploy-frontend-prod.yml — not committed. */
          window.__ENV__ = {
            FLASHCARDS_API_URL: "https://api-flashcards.toondemy.com",
            WORKSHEETS_API_URL: "https://api-flashcards.toondemy.com",
            PUBLIC_ASSET_URL: ""
          };
          EOF

          # Strip accidental leading spaces from the heredoc body
          sed -i 's/^[[:space:]]*//' public/env-config.js

          echo "Prepared public/index.html and public/env-config.js"
          cat public/env-config.js

      - name: Configure AWS credentials for flashcards_deploy.sh
        run: |
          set -euo pipefail
          PROFILE_NAME="react-deployer"
          REGION="${{ secrets.AWS_REGION }}"
          REGION="${REGION:-ap-south-1}"

          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}" --profile "$PROFILE_NAME"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}" --profile "$PROFILE_NAME"
          aws configure set region "$REGION" --profile "$PROFILE_NAME"
          aws configure set output "json" --profile "$PROFILE_NAME"

      - name: Deploy with flashcards_deploy.sh
        run: bash flashcards_deploy.sh
