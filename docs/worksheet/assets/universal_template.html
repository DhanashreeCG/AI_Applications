<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Universal Template</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1016px;
      height: 1316px;
      overflow: hidden;
      background: #ffffff;
    }
    body {
      position: relative;
      font-family: 'Toondemy', sans-serif;
      color: #2a1b4a;
    }
    img.worksheet-bg {
      position: absolute;
      left: 0;
      top: 0;
      width: 1016px;
      height: 1316px;
      object-fit: fill;
      z-index: 0;
      pointer-events: none;
    }

    /* FIXED chrome — title (purple banner) */
    .main-topic {
      position: absolute;
      left: 36px;
      top: 22px;
      width: 440px;
      z-index: 6;
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 0.3px;
      line-height: 1.05;
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(44, 20, 70, 0.28);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* FIXED chrome — subtitle (blue banner), lowered for vertical centering */
    .sub-topic {
      position: absolute;
      left: 520px;
      top: 84px;
      width: 450px;
      height: 36px;
      z-index: 6;
      margin: 0;
      padding: 0 12px;
      box-sizing: border-box;
      font-size: 26px;
      font-weight: 700;
      line-height: 36px;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 1px 2px rgba(30, 90, 130, 0.35);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /*
      DYNAMIC viewport — fills from below chrome to just above
      Teacher signature / stars (~y=1245 on 1316 canvas).
      Activity heights are calculated by the layout engine (--activity-height).
    */
    #content-region,
    #content-region * {
      box-sizing: border-box;
    }
    #content-region {
      position: absolute;
      left: 40px;
      top: 128px;
      width: 936px;
      height: 1104px;
      z-index: 2;
      overflow: hidden;
      padding: 4px 8px 10px;
      color: #2a1b4a;
      font-size: 18px;
      line-height: 1.3;
    }
    #content-region .ws-dynamic {
      display: flex;
      flex-direction: column;
      gap: var(--activity-gap, 12px);
      width: 100%;
      height: 100%;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
      justify-content: flex-start;
    }
    #content-region .ws-dynamic > .ws-instruction {
      flex: 0 0 auto;
      max-height: none;
      height: auto;
      overflow: visible;
    }
    /* Activities use calculated heights — NEVER equal flex:1 sharing */
    #content-region .ws-dynamic > .ws-activity,
    #content-region .ws-dynamic > .ws-section {
      flex: 0 0 auto !important;
      flex-grow: 0 !important;
      height: var(--activity-height, auto);
      max-height: var(--activity-height, none);
      min-height: 0;
      overflow: hidden;
      position: relative;
      z-index: 0;
      margin: 0 !important;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    /* Nested stack roots must not steal leftover height */
    #content-region .ws-dynamic > .ws-stack {
      flex: 0 0 auto !important;
      height: auto !important;
      max-height: none !important;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      overflow: hidden;
    }
    #content-region .ws-activity-title,
    #content-region .ws-activity-instruction {
      flex: 0 0 auto;
      margin: 0;
      line-height: 1.25;
    }
    #content-region .ws-row,
    #content-region .ws-grid {
      display: flex;
      flex-wrap: wrap;
      gap: var(--image-gap, 8px);
      align-items: flex-start;
      justify-content: flex-start;
      width: 100%;
    }
    #content-region .ws-match-area {
      display: flex;
      flex-direction: column;
      gap: var(--image-gap, 10px);
      width: 100%;
    }
    #content-region .ws-match-row {
      display: grid;
      grid-template-columns: 1fr 48px 1fr;
      gap: var(--image-gap, 10px);
      align-items: center;
      width: 100%;
    }
    #content-region .ws-match-connector {
      height: 2px;
      background: #85cbf4;
      opacity: 0.55;
    }
    #content-region .ws-image-grid,
    #content-region .ws-choice-group {
      display: grid;
      gap: var(--image-gap, 8px);
      width: 100%;
      align-items: start;
      justify-items: center;
    }
    #content-region .ws-trace-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }
    #content-region .ws-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 0 0 auto;
      height: auto;
    }
    /* Nested cards must hug content — never flex-grow into empty tall shells */
    #content-region .ws-item,
    #content-region .ws-picture-card,
    #content-region .ws-answer-option,
    #content-region .ws-activity > div,
    #content-region .ws-section > div,
    #content-region .ws-activity > section,
    #content-region .ws-section > section,
    #content-region .ws-activity > article,
    #content-region .ws-section > article {
      flex: 0 0 auto !important;
      flex-grow: 0 !important;
      flex-shrink: 1 !important;
      flex-basis: auto !important;
      height: auto !important;
      max-height: 100%;
      align-self: flex-start;
      box-sizing: border-box;
    }
    #content-region .ws-img-box {
      display: flex !important;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex: 0 0 auto !important;
      flex-shrink: 0 !important;
      width: var(--image-size, 160px);
      height: var(--image-size, 160px);
      min-width: 0;
      min-height: 0;
      max-width: min(300px, 100%);
      max-height: min(300px, 100%);
      aspect-ratio: 1 / 1;
      box-sizing: border-box;
    }
    #content-region img.worksheet-image,
    #content-region .ws-img-box img.worksheet-image,
    #content-region .ws-img-box > img {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain !important;
      display: block !important;
      aspect-ratio: 1 / 1;
    }
    #content-region .ws-label,
    #content-region .ws-word,
    #content-region .ws-trace-word {
      flex: 0 0 auto;
      text-align: center;
    }
  </style>
</head>
<body class="{{BODY_CLASS}}">
  <img class="worksheet-bg" src="{{BACKGROUND_IMAGE}}" alt="" />
  <div class="main-topic" data-editable="main_topic">{{main_topic}}</div>
  <div class="sub-topic" data-editable="sub_topic">{{sub_topic}}</div>
  <div id="content-region">{{CONTENT_HTML}}</div>
</body>
</html>
