<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Universal Template</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1016px;
      height: 1316px;
      overflow: hidden;
      background: #ffffff;
    }
    body {
      position: relative;
      font-family: 'Toondemy', sans-serif;
      color: #2a1b4a;
    }
    img.worksheet-bg {
      position: absolute;
      left: 0;
      top: 0;
      width: 1016px;
      height: 1316px;
      object-fit: fill;
      z-index: 0;
      pointer-events: none;
    }

    /* FIXED chrome — title */
    .main-topic {
      position: absolute;
      left: 36px;
      top: 22px;
      width: 440px;
      z-index: 6;
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 0.3px;
      line-height: 1.05;
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(44, 20, 70, 0.28);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* FIXED chrome — subtitle / skill label */
    .sub-topic {
      position: absolute;
      left: 520px;
      top: 44px;
      width: 450px;
      z-index: 6;
      margin: 0;
      padding: 0 12px;
      box-sizing: border-box;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.15;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 1px 2px rgba(30, 90, 130, 0.35);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* FIXED chrome — Name / Date pills */
    .meta-row {
      position: absolute;
      left: 48px;
      top: 138px;
      width: 920px;
      z-index: 6;
      display: flex;
      align-items: stretch;
      gap: 18px;
      box-sizing: border-box;
    }
    .meta-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 16px;
      box-sizing: border-box;
      border: 2px solid #7eb8e8;
      border-radius: 14px;
      background: #eef7ff;
    }
    .meta-pill.name-pill { flex: 1.65; }
    .meta-pill.date-pill { flex: 1; }
    .meta-pill .meta-label {
      flex: 0 0 auto;
      font-size: 18px;
      font-weight: 700;
      color: #2f6fad;
      line-height: 1;
    }
    .meta-pill .meta-line {
      flex: 1;
      height: 0;
      border-bottom: 2px dashed #8ebce0;
      min-width: 80px;
    }

    /*
      DYNAMIC viewport only — LLM invents all markup/styles inside.
      Host provides size + Toondemy inheritance.
    */
    #content-region {
      position: absolute;
      left: 40px;
      top: 198px;
      width: 936px;
      height: 930px;
      z-index: 2;
      overflow: hidden;
      box-sizing: border-box;
      padding: 4px 6px 8px;
      color: #2a1b4a;
      font-size: 20px;
      line-height: 1.35;
    }
    #content-region .ws-dynamic {
      width: 100%;
      height: 100%;
      min-height: 100%;
      box-sizing: border-box;
    }
    #content-region img.worksheet-image {
      max-width: 200px;
      max-height: 200px;
      object-fit: contain;
      vertical-align: middle;
    }
  </style>
</head>
<body class="{{BODY_CLASS}}">
  <img class="worksheet-bg" src="{{BACKGROUND_IMAGE}}" alt="" />
  <div class="main-topic" data-editable="main_topic">{{main_topic}}</div>
  <div class="sub-topic" data-editable="sub_topic">{{sub_topic}}</div>
  <div class="meta-row" aria-hidden="true">
    <div class="meta-pill name-pill">
      <span class="meta-label">Name:</span><span class="meta-line"></span>
    </div>
    <div class="meta-pill date-pill">
      <span class="meta-label">Date:</span><span class="meta-line"></span>
    </div>
  </div>
  <div id="content-region">{{CONTENT_HTML}}</div>
</body>
</html>
